services:
  db:
    image: postgres:17-alpine
    container_name: gtd_db
    volumes:
      - gtd_postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build: .
    image: gtd-planner:latest
    container_name: gtd_web
    read_only: true
    tmpfs:
      - /tmp
      - /run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "8003:8000"
    env_file:
      - .env
    volumes:
      - ./client_secret.json:/app/client_secret.json:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  gtd_postgres_data: