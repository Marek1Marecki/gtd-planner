[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["web"]

[project]
name = "gtd-planner"
version = "0.1.0"
description = "GTD Planner - aplikacja do zarządzania zadaniami w architekturze heksagonalnej"
requires-python = ">=3.14"
dependencies = [
    # Core Django
    "django>=6.0.3",
    "django-environ>=0.12.0",
    "django-filter>=25.0",
    "django-widget-tweaks>=1.5.0",
    # Database
    "psycopg2-binary>=2.9.11",
    # Google API Integration
    "google-api-python-client>=2.100.0",
    "google-auth>=2.0.0,<3.0.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.3.0",
    # Async tasks
    "celery>=5.3.0",
    "redis>=5.0.0",
    # Date/Time
    "pytz>=2024.1",
    "python-dateutil>=2.9.0",
    # Utilities
    "Pillow>=10.0.0",
    "requests>=2.31.0",
    # Web server
    "gunicorn>=22.0.0",
    "whitenoise>=6.6.0",
    # Environment
    "python-dotenv>=1.0.0",
    "types-python-dateutil[dev]>=2.9.0.20260302",
    "types-pytz[dev]>=2026.1.1.20260304",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-django>=4.7.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.5.0",
    "mypy>=1.8.0",
    "django-stubs>=5.0.0",
    "pre-commit>=3.6.0",
    "ipython>=8.20.0",
]

[dependency-groups]
dev = [
    "mkdocs-material>=9.7.4",
    "mkdocstrings[python]>=1.0.3",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
# Select: Łączymy Twoje kody z nowymi (D, UP, TID)
select = [
    "E",   # Error (podstawowe błędy)
    "F",   # Pyflakes (logika)
    "W",   # Warning (styl)
    "I",   # Isort (sortowanie importów)
    "B",   # Bugbear (częste błędy logiczne)
    "C4",  # Comprehensions (lepsze listy/słowniki)
    "UP",  # Pyupgrade (wymuszanie nowoczesnej składni Pythona 3.14)
    "D",   # Pydocstyle (dokumentacja w kodzie)
    "TID", # Tidy Imports (blokowanie niepoprawnych kierunków importów)
]
ignore = []

[tool.ruff.lint.pydocstyle]
# Wybieramy konwencję Google dla docstringów
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tutaj dzieje się magia: pilnujemy dokumentacji tylko tam, gdzie to ważne
"web/apps/*/domain/**" = []            # W domenie D jest obowiązkowe
"web/apps/*/application/**" = []       # W aplikacji D jest obowiązkowe
"web/apps/*/adapters/**" = []
"web/apps/*/ports/**" = []
# Wszędzie indziej wyłączamy wymóg docstringów (D), aby nie spowalniać pracy
"web/apps/*/tests/**" = ["D"]
"web/apps/*/migrations/**" = ["D"]
"web/apps/*/views.py" = []
"web/apps/*/models.py" = []
"web/apps/*/services.py" = []
"web/apps/*/apps.py" = []
"web/apps/*/admin.py" = ["D"]
"web/gtd_calendar/**" = ["D"]
"web/manage.py" = ["D"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
plugins = ["mypy_django_plugin.main"]
# TO JEST KLUCZOWA ZMIANA:
mypy_path = "web"

[tool.django-stubs]
django_settings_module = "gtd_calendar.settings"

[tool.pytest.ini_options]
# Ścieżka do ustawień Django
DJANGO_SETTINGS_MODULE = "gtd_calendar.settings"
# Szukamy testów wyłącznie w katalogu web/
testpaths = ["web"]
# Formaty plików testowych
python_files = ["test_*.py", "*_test.py"]
# Opcje uruchamiania: rygor markerów, krótkie tracebacki, szczegółowe nazwy testów
addopts = [
    "--strict-markers",
    "--verbose",
    "--tb=short",
]
# Definicja jedynego dopuszczalnego markera "ciężkiego"
markers = [
    "integration: testy wolne, wymagające bazy danych lub dostępu do API",
]
# Wyciszenie szumu informacyjnego o naive datetime
filterwarnings = [
    "ignore:DateTimeField .* received a naive datetime:RuntimeWarning",
]

[tool.coverage.run]
source = ["web"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
    "web/manage.py",
    "web/apps/calendar_app/adapters/google_calendar.py",
]
