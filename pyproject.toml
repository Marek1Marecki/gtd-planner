[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["web"]

[project]
name = "gtd-planner"
version = "0.1.0"
description = "GTD Planner - aplikacja do zarządzania zadaniami w architekturze heksagonalnej"
requires-python = ">=3.14"
dependencies = [
    # Core Django
    "django>=6.0.3",
    "django-environ>=0.12.0",
    "django-filter>=25.0",
    "django-widget-tweaks>=1.5.0",
    # Database
    "psycopg2-binary>=2.9.11",
    # Google API Integration
    "google-api-python-client>=2.100.0",
    "google-auth>=2.0.0,<3.0.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.3.0",
    # Async tasks
    "celery>=5.3.0",
    "redis>=5.0.0",
    # Date/Time
    "pytz>=2024.1",
    "python-dateutil>=2.9.0",
    # Utilities
    "Pillow>=10.0.0",
    "requests>=2.31.0",
    # Web server
    "gunicorn>=22.0.0",
    "whitenoise>=6.6.0",
    # Environment
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-django>=4.7.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.15.2",
    "mypy>=1.19.1",
    "django-stubs>=5.0.0",
    "pre-commit>=4.0.0",
    "ipython>=9.0.0",
    "types-python-dateutil>=2.9.0.20260302",
    "types-pytz>=2026.1.1.20260304",
]

[dependency-groups]
dev = [
    "import-linter>=2.11",
    "sphinx>=9.1.0",
    "sphinx-autodoc-typehints>=3.9.7",
    "sphinx-rtd-theme>=3.1.0",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
# Zestaw reguł Contract v1.8: Logika + Styl + Dokumentacja + Nowoczesna składnia
select = [
    "E",   # Error
    "F",   # Pyflakes
    "W",   # Warning
    "I",   # Isort
    "B",   # Bugbear
    "C4",  # Comprehensions
    "UP",  # Pyupgrade (Python 3.14)
    "D",   # Pydocstyle (Google Style Docstrings)
    "TID", # Tidy Imports (Layer Direction)
]
ignore = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Wymuszamy dokumentację w rdzeniu aplikacji
"web/apps/*/domain/**" = []
"web/apps/*/application/**" = []
"web/apps/*/adapters/**" = []
"web/apps/*/ports/**" = []
# Ignorujemy dokumentację w infrastrukturze i testach dla szybkości deweloperskiej
"web/apps/*/tests/**" = ["D"]
"web/apps/*/migrations/**" = ["D"]
"web/apps/*/views.py" = []
"web/apps/*/models.py" = []
"web/apps/*/services.py" = []
"web/apps/*/apps.py" = []
"web/apps/*/admin.py" = ["D"]
"web/gtd_calendar/**" = ["D"]
"web/manage.py" = ["D"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
plugins = ["mypy_django_plugin.main"]
mypy_path = "web"

[tool.django-stubs]
django_settings_module = "gtd_calendar.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "gtd_calendar.settings"
testpaths = ["web"]
python_files = ["test_*.py", "*_test.py"]
addopts = [
    "--strict-markers",
    "--verbose",
    "--tb=short",
]
markers = [
    "integration: testy wolne, wymagające bazy danych lub dostępu do API",
]
filterwarnings = [
    "ignore:DateTimeField .* received a naive datetime:RuntimeWarning",
]

[tool.coverage.run]
source = ["web"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
    "web/manage.py",
    "web/apps/calendar_app/adapters/google_calendar.py",
]
