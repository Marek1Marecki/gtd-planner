name: Contract Enforcement (v1.7)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    # DODAJEMY SERWIS BAZY DANYCH
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: gtd_db
          POSTGRES_USER: gtd_user
          POSTGRES_PASSWORD: gtd_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Validate Lockfile Synchronization
        run: uv lock --check

      - name: Install Dependencies
        run: uv sync --all-extras --dev

      - name: Run Quality Check
        run: |
          cp .env.example .env
          export PYTHONPATH=web
          # USTAWIAMY POŁĄCZENIE DO POSTGRESA W CI
          export DATABASE_URL=postgres://gtd_user:gtd_password@localhost:5432/gtd_db
          export SECRET_KEY=ci-testing-key
          
          # Uruchamiamy make check, ale CI musi uruchomić WSZYSTKIE testy, 
          # aby sprawdzić coverage 80%
          make check MIN_COVERAGE=80  # Makefile powinien teraz odpalić pytest web