name: Contract Enforcement (v1.7)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    # DODAJEMY SERWIS BAZY DANYCH
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: gtd_db
          POSTGRES_USER: gtd_user
          POSTGRES_PASSWORD: gtd_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Validate Lockfile Synchronization
        run: uv lock --check

      - name: Install Dependencies
        run: uv sync --all-extras --dev

      - name: Run Quality Check
        run: |
          # Tworzymy KOMPLETNY plik .env (identyczny w strukturze z .env.example)
          cat <<EOF > .env
          SECRET_KEY=ci-dummy-secret-key-12345
          DEBUG=0
          ALLOWED_HOSTS=localhost,127.0.0.1
          DATABASE_URL=postgres://gtd_user:gtd_password@localhost:5432/gtd_db
          POSTGRES_DB=gtd_db
          POSTGRES_USER=gtd_user
          POSTGRES_PASSWORD=gtd_password
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5432
          GOOGLE_CLIENT_ID=dummy-google-id
          GOOGLE_CLIENT_SECRET=dummy-google-secret
          CELERY_BROKER_URL=redis://localhost:6379/0
          EOF
          
          export PYTHONPATH=web
          # Przekazujemy kluczowe zmienne do shella dla pewności
          export SECRET_KEY=ci-dummy-secret-key-12345
          export DATABASE_URL=postgres://gtd_user:gtd_password@localhost:5432/gtd_db
          
          make check

  security-gate:
    needs: quality-gate # To zadanie ruszy tylko jeśli testy przejdą
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t gtd-planner:latest .

      - name: Tier 2 Run Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'gtd-planner:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Tier 2 Run Runtime Integrity Test
        run: |
          docker run --rm --read-only --tmpfs /tmp gtd-planner:latest python -c "open('/tmp/test', 'w').write('ok')"
          if docker run --rm --read-only --tmpfs /tmp gtd-planner:latest python -c "open('/app/test', 'w')" 2>&1 | grep -q "Read-only"; then
            echo "✅ /app is correctly protected"
          else
            echo "❌ SECURITY BREACH: /app is writable!"
            exit 1
          fi