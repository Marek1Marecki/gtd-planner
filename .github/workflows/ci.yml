name: Contract Enforcement (v1.7)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    # DODAJEMY SERWIS BAZY DANYCH
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: gtd_db
          POSTGRES_USER: gtd_user
          POSTGRES_PASSWORD: gtd_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Validate Lockfile Synchronization
        run: uv lock --check

      - name: Install Dependencies
        run: uv sync --all-extras --dev

      - name: Run Quality Check
        run: |
          # Tworzymy kompletny plik .env dla CI
          cat <<EOF > .env
          SECRET_KEY=ci-dummy-secret-key-12345
          DEBUG=0
          ALLOWED_HOSTS=localhost,127.0.0.1
          DATABASE_URL=postgres://gtd_user:gtd_password@localhost:5432/gtd_db
          POSTGRES_DB=gtd_db
          POSTGRES_USER=gtd_user
          POSTGRES_PASSWORD=gtd_password
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5432
          EOF
          
          export PYTHONPATH=web
          # Dodatkowe exporty dla pewności narzędzi
          export SECRET_KEY=ci-dummy-secret-key-12345
          export DATABASE_URL=postgres://gtd_user:gtd_password@localhost:5432/gtd_db
          
          make check